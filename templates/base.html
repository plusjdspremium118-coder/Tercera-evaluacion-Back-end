{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}{% endblock %} - Vivero Hojas Verdes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .navbar-custom { background-color: #2d7a3a; }
        .btn-verde { background-color: #2d7a3a; color: white; }
        .btn-verde:hover { background-color: #235e2d; color: white; }
        .bg-card-verde { background-color: #eaf5eb; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'inicio' %}">Vivero Hojas Verdes</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="{% url 'inicio' %}">Inicio</a>
                <a class="nav-link text-white" href="{% url 'plantas' %}">Plantas</a>
                <a class="nav-link text-white" href="{% url 'nosotros' %}">Nosotros</a>
            </div>
        </div>
    </nav>


    <div class="container mt-4 mb-5 flex-grow-1">
        {% block contenido %}{% endblock %}
    </div>


    <footer class="bg-light text-muted py-3 border-top mt-auto text-center small">
        <div class="container">
            Vivero Hojas Verdes | Av. Ejemplo 1234, Maipú | contacto@hojasverdes.cl
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
